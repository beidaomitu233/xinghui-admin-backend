# -------------------------------------------------------------------
# 1. 服务端口配置
# -------------------------------------------------------------------
server:
  port: 7799

# -------------------------------------------------------------------
# 2. 数据库连接（单一来源）
# Flyway 与 dynamic-datasource 主库共同引用 ${db.*}，避免两处双写产生参数漂移
# -------------------------------------------------------------------
db:
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

# -------------------------------------------------------------------
# 3. Spring 核心配置
# -------------------------------------------------------------------
spring:
  # 包含外部配置文件 (application-datasource.yml)
  profiles:
    include: datasource

  # Flyway 数据库版本化迁移
  # 注意: 项目使用 dynamic-datasource，Flyway 无法从 spring.datasource 自动推导连接，
  # 必须显式指定连接信息（引用上方 db.* 单一来源）。
  # baseline-version=2 仅为经审查的存量库手动基线保留；默认关闭自动 baseline。
  # 全新空库则完整执行 V1(表结构) + V2(种子数据)；之后的增量脚本对两者都会执行。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${db.url}
    user: ${db.username}
    password: ${db.password}
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 2
    validate-on-migrate: true
    out-of-order: false
    ignore-migration-patterns: ['']
    clean-disabled: true
    connect-retries: 3

  # Redis 缓存配置
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD}

  # Servlet 文件上传配置（必须位于 spring: 节点下才生效）
  servlet:
    multipart:
      max-file-size: 100MB # 配置上传文件大小最大值
      max-request-size: 1000MB # 配置请求体大小最大值 (通常用于下载/上传流)

# Redisson 配置
redisson:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    timeout: 3000
    connectionPoolSize: 32
    connectionMinimumIdleSize: 8

# -------------------------------------------------------------------
# 3. 日志配置 (Logging)
# -------------------------------------------------------------------
# 全局 debug 模式，mapper 层设置为 debug 模式以便打印 SQL 语句
logging:
  level:
    root: info
    com.xinghuiTec.mapper: warn

# -------------------------------------------------------------------
# 4. 用户配置
# -------------------------------------------------------------------
# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# -------------------------------------------------------------------
# 5. 验证码配置
# -------------------------------------------------------------------
# 验证码配置
captcha:
  enabled: false # 是否启用验证码
  type: numeric # 验证码类型: numeric(4位数字) 或 arithmetic(算术运算)
  expire-time: 5 # 验证码过期时间(分钟)
  width: 120 # 验证码图片宽度
  height: 40 # 验证码图片高度
  code-length: 4 # 数字验证码长度

# -------------------------------------------------------------------
# 6. MyBatis-Plus 配置
# -------------------------------------------------------------------
mybatis-plus:
  configuration:
    auto-mapping-behavior: full # 数据库字段和实体类自动映射
    map-underscore-to-camel-case: true # 开启下划线转驼峰命名
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl # 使用 SLF4J 打印日志
  global-config:
    db-config:
      logic-delete-field: isDeleted # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值 (默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值 (默认为 0)

# -------------------------------------------------------------------
# 7. 多租户配置
# -------------------------------------------------------------------
# 多租户配置
tenant:
  enable: false  # 是否启用多租户功能（设为true开启）
  excludes:       # 排除表（不参与租户隔离）
    - sys_menu           # 菜单表（全局配置）
    - sys_tenant         # 租户表本身
    - sys_tenant_package # 租户套餐表
    - sys_role_menu      # 角色菜单关联
    - sys_user_role      # 用户角色关联

# -------------------------------------------------------------------
# 8. X File Storage 文件管理配置（多平台OSS）
# -------------------------------------------------------------------
dromara:
  x-file-storage:
    # 默认存储平台（设为 minio-1 使用 MinIO）
    default-platform: minio-1
    thumbnail-suffix: ".min.jpg"

    # ========== MinIO 存储（默认关闭；启用时完整覆盖本列表） ==========
    minio:
      - platform: minio-1
        enable-storage: ${OSS_ENABLED:false}
        access-key: ${OSS_ACCESS_KEY:}
        secret-key: ${OSS_SECRET_KEY:}
        end-point: ${OSS_ENDPOINT:}
        bucket-name: ${OSS_BUCKET:}
        base-path: ${OSS_PREFIX:}

    # 其他存储平台按供应商文档在私有外部配置中完整声明。

# -------------------------------------------------------------------
# 9. SMS 短信配置（sms4j 多厂商）
# -------------------------------------------------------------------
sms:
  config-type: yaml          # 配置来源
  restricted: true           # 开启短信拦截
  minute-max: 1              # 单手机号每分钟最大发送
  account-max: 30            # 单手机号每日最大发送
  blends:
    # 阿里云短信
    alibaba:
      supplier: alibaba
      access-key-id: ${SMS_ALIBABA_ACCESS_KEY:}
      access-key-secret: ${SMS_ALIBABA_SECRET_KEY:}
      signature: ${SMS_SIGNATURE:}
      sdk-app-id: ${SMS_ALIBABA_APP_ID:}
    # 腾讯云短信
    # tencent:
    #   supplier: tencent
    #   access-key-id: your_secret_id
    #   access-key-secret: your_secret_key
    #   signature: 兴辉科技
    #   sdk-app-id: your_app_id
    #   template-id: your_template_id

# -------------------------------------------------------------------
# 10. Mail 邮件配置（默认关闭）
# -------------------------------------------------------------------
mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:465}
  auth: true
  from: ${MAIL_FROM:}
  user: ${MAIL_USER:}
  pass: ${MAIL_PASS:}
  starttlsEnable: true
  sslEnable: true

# -------------------------------------------------------------------
# 11. JustAuth 三方登录配置
# -------------------------------------------------------------------
# 第三方登录仅在私有外部配置中显式声明应用信息；默认不配置。

# NTF-01: exact HTTPS host allowlist for optional template links; empty means external links are denied.
notification:
  allowed-link-hosts: ${NOTIFICATION_ALLOWED_LINK_HOSTS:}
